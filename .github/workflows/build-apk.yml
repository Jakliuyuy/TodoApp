name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 Debug / Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      KEYSTORE_FILE: ${{ github.workspace }}/todo-release.jks
      KEYSTORE_PASSWORD: '123456'
      KEY_ALIAS: todo
      KEY_PASSWORD: '123456'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 接受 Android SDK 许可
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      # 仓库里不含 gradle-wrapper.jar（二进制文件），由 CI 现场生成，保证构建可复现
      - name: 安装 Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: 生成 Release 签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=TodoApp, OU=Dev, O=Yuanbao, L=Lhasa, S=Xizang, C=CN"

      - name: 编译 Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 编译 Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TodoApp-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/TodoApp-release.apk
          ls -lh artifacts

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: TodoApp-APK
          path: artifacts/*.apk
          retention-days: 30

      - name: 打 Tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
