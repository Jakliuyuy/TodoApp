name: 环境诊断

# 轻量探针：10 秒内跑完，把 runner 的 Android SDK 环境写到仓库的 build-logs 分支
# 用于定位构建失败的根因，确认问题后可删除本文件
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  probe:
    name: 探测 SDK 环境
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: 采集环境信息
        run: |
          set +e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          OUT="$RUNNER_TEMP/env.txt"

          {
            echo "===== 基本信息 ====="
            echo "时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner OS: $RUNNER_OS"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "生效的 SDK 路径: $SDK"
            echo
            echo "===== Java ====="
            java -version 2>&1
            echo "JAVA_HOME=$JAVA_HOME"
            echo
            echo "===== 已安装的平台 (platforms) ====="
            ls -1 "$SDK/platforms" 2>&1
            echo
            echo "===== 已安装的构建工具 (build-tools) ====="
            ls -1 "$SDK/build-tools" 2>&1
            echo
            echo "===== cmdline-tools ====="
            ls -1 "$SDK/cmdline-tools" 2>&1
            echo
            echo "===== licenses 目录 ====="
            ls -la "$SDK/licenses" 2>&1
            echo "--- android-sdk-license 内容 ---"
            sudo cat "$SDK/licenses/android-sdk-license" 2>&1 || cat "$SDK/licenses/android-sdk-license" 2>&1
            echo
            echo "===== sdkmanager 可用版本 ====="
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SM" ]; then
              "$SM" --list_installed 2>&1 | head -40
            else
              echo "未找到 sdkmanager: $SM"
            fi
            echo
            echo "===== NDK / 其他 ====="
            ls -1 "$SDK" 2>&1
          } > "$OUT" 2>&1

          echo "===== 采集结果 ====="
          cat "$OUT"
          cp "$OUT" "$GITHUB_WORKSPACE/env.txt"

      - name: 归档诊断结果到 build-logs 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p logs
          cp "$GITHUB_WORKSPACE/env.txt" logs/env.txt || true
          git add logs
          git commit -m "env probe $(date -u +%Y%m%dT%H%M%SZ)" || echo "无变更，跳过提交"
          git push -f origin build-logs
